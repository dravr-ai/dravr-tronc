name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "debug/**", "feature/**", "features/**", "fix/**", "claude/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo check --all-targets --features notifications
      # The feature alone. Every other job reaches service_client only through
      # --all-features, which would hide a feature edge it is missing.
      - run: cargo check --all-targets --features service-client
      # The feature alone, as a host enables it: --all-features would supply
      # any item it reaches that only another feature brings in.
      - run: cargo check --all-targets --features schema-validation
      # The emitter profile. Every other job passes --features notifications,
      # so without this nothing catches an item being moved back behind that
      # feature. NOTIFY_TARGET is the case that matters: a crate that only
      # emits notify events must reach it without pulling the sender's
      # reqwest/ring/hex, and when it could not, dravr-stripe copied the
      # constant instead of importing it.
      - run: cargo check --all-targets --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --quiet
      # --all-features, not a hand-picked list: google-iam's tests sat behind a
      # feature no job enabled, so the ID-token middleware two deployed services
      # rely on compiled here but never ran.
      - run: cargo clippy --all-targets --all-features --quiet

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --all-features

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The official suite against examples/conformance_server.rs, both eras,
      # each against its committed baseline under conformance/: a regression
      # and a fixed-but-still-listed scenario both fail the job.
      - run: bash scripts/ci/conformance.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conformance-results
          path: target/conformance

  lockstep:
    name: Consumer-bump lockstep (shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The lockstep step of consumer-bump.yml, lifted out of the YAML and run
      # against a fixture repo with curl/git/cargo answered from canned data.
      # Runs here on the runner's own sed, sort and coreutils, the ones the
      # real step uses; nothing about the step can be reached by cargo test.
      - run: bash scripts/consumer-bump-lockstep.test.sh
      - run: bash scripts/consumer-bump-gate.test.sh

  validate:
    name: Architectural Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Run architectural validation
        run: .build/validation/validate.sh

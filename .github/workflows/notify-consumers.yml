# ABOUTME: Tells every tronc consumer a release exists, so their pins stop drifting apart
# ABOUTME: Fires repository_dispatch org-wide; a repo's tronc-bump.yml is what enrols it

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# This is one end of the wire; each consumer's `tronc-bump.yml` is the other, and
# both call `consumer-bump.yml` in this repo for the actual work.
#
# Called by release.yml rather than triggered by `on: release`. The release is
# created with the default GITHUB_TOKEN, and GitHub does not start workflow runs
# from events a GITHUB_TOKEN produced — so an `on: release` trigger here could never
# fire. That is exactly how sciotte's notifier logged zero runs across five releases
# while looking perfectly wired. A trigger that cannot fire is worse than no trigger.
#
# DISCOVERY IS BY OPT-IN, NOT BY LIST. This dispatches `tronc-released` at every
# non-archived repo in the org and lets the ones that care answer. A repo with no
# workflow listening for that event type ignores it silently, so there is no list
# here to fall out of date — adding `tronc-bump.yml` to a repo is what enrols it,
# and archiving a repo removes it. contremaitre-bump.yml learned the alternative the
# hard way: a hardcoded list left one crate behind, which put two versions in
# Cargo.lock and hard-failed Security Audit on main.
#
# A repo is a consumer if it carries the caller file; that is checked before
# anything is sent, so repos without one are skipped rather than dispatched at
# and reported as unreachable. A consumer that cannot be dispatched to FAILS THIS
# RUN. The first release through this wire, tronc 1.0.0 on 2026-09-04, reached
# two of eleven consumers — DRAVR_PLATFORM_DISPATCH_TOKEN was scoped to the
# platform and photograveur — and the run was green with nine warnings nobody
# was reading. Reach is a property of the token, not of this file, and a token
# that has narrowed is a red release, not a footnote. The weekly cron on each
# caller remains the safety net for a dispatch lost in transit, not for a token
# that cannot reach.

name: "Tronc: Notify Consumers of Release"

on:
  workflow_call:
    inputs:
      version:
        description: "Tag to announce"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to announce (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch tronc-released across the org
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version being announced
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a release tag to announce"
            exit 1
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "announcing ${VERSION}"

      - name: Fire repository_dispatch at every live repo in the org
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PLATFORM_DISPATCH_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -uo pipefail
          REPOS=$(gh api --paginate 'orgs/dravr-ai/repos?type=all&per_page=100' \
                  --jq '.[] | select(.archived == false) | select(.fork == false) | .full_name')
          if [ -z "${REPOS}" ]; then
            echo "::error::listed no repos — the dispatch token cannot see the org"
            exit 1
          fi

          SENT=""; MISSED=""; NOT_CONSUMER=""; UNREADABLE=""
          for R in ${REPOS}; do
            # Consumer or not: the caller file is the enrolment, so its presence is
            # the test. 200 = consumer; 404 = not a consumer, skip quietly; anything
            # else means the token cannot even read the repo, which is the same
            # failure as not being able to dispatch to it.
            CODE=$(gh api "repos/${R}/contents/.github/workflows/tronc-bump.yml" \
                     -H "Accept: application/vnd.github.object" >/dev/null 2>&1 && echo 200 || echo other)
            if [ "${CODE}" != "200" ]; then
              if gh api "repos/${R}" >/dev/null 2>&1; then
                NOT_CONSUMER="${NOT_CONSUMER} ${R}"
              else
                echo "::error::cannot read ${R} with DRAVR_PLATFORM_DISPATCH_TOKEN — widen the token's repository access"
                UNREADABLE="${UNREADABLE} ${R}"
              fi
              continue
            fi
            # A consumer answers 204 to the dispatch whether or not its run then
            # does anything; the consumer's own run is the evidence, not this send.
            if gh api -X POST "repos/${R}/dispatches" \
                 -f event_type=tronc-released \
                 -F client_payload[version]="${VERSION}" \
                 -F client_payload[sha]="${GITHUB_SHA}" 2>/dev/null; then
              echo "dispatched -> ${R}"
              SENT="${SENT} ${R}"
            else
              echo "::error::could not dispatch to consumer ${R} — token scope, or Actions disabled there"
              MISSED="${MISSED} ${R}"
            fi
          done

          {
            echo "### tronc ${VERSION} announced"
            echo ""
            echo "Dispatched \`tronc-released\` to **$(echo ${SENT} | wc -w | tr -d ' ')** consumer(s):"
            for R in ${SENT}; do echo "- \`${R}\`"; done
            if [ -n "${MISSED}${UNREADABLE}" ]; then
              echo ""
              echo "**Could not reach** — this run is red until the token reaches them:"
              for R in ${MISSED} ${UNREADABLE}; do echo "- \`${R}\`"; done
              echo ""
              echo "Dispatch each by hand meanwhile: \`gh workflow run tronc-bump.yml -R <repo> -f version=${VERSION}\`."
            fi
            if [ -n "${NOT_CONSUMER}" ]; then
              echo ""
              echo "Not consumers (no \`tronc-bump.yml\`), skipped:"
              for R in ${NOT_CONSUMER}; do echo "- \`${R}\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${MISSED}${UNREADABLE}" ]; then
            echo "::error::$(echo ${MISSED} ${UNREADABLE} | wc -w | tr -d ' ') repo(s) unreachable — the fan-out did not happen for them"
            exit 1
          fi
          if [ -z "${SENT}" ]; then
            echo "::error::no consumer reached — every repo read as a non-consumer, which cannot be right while the fleet carries callers"
            exit 1
          fi

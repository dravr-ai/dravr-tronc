# ABOUTME: Tells every tronc consumer a release exists, so their pins stop drifting apart
# ABOUTME: Fires repository_dispatch org-wide; a repo's tronc-bump.yml is what enrols it

# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai
#
# This is one end of the wire; each consumer's `tronc-bump.yml` is the other, and
# both call `consumer-bump.yml` in this repo for the actual work.
#
# Called by release.yml rather than triggered by `on: release`. The release is
# created with the default GITHUB_TOKEN, and GitHub does not start workflow runs
# from events a GITHUB_TOKEN produced — so an `on: release` trigger here could never
# fire. That is exactly how sciotte's notifier logged zero runs across five releases
# while looking perfectly wired. A trigger that cannot fire is worse than no trigger.
#
# DISCOVERY IS BY OPT-IN, NOT BY LIST. This dispatches `tronc-released` at every
# non-archived repo in the org and lets the ones that care answer. A repo with no
# workflow listening for that event type ignores it silently, so there is no list
# here to fall out of date — adding `tronc-bump.yml` to a repo is what enrols it,
# and archiving a repo removes it. contremaitre-bump.yml learned the alternative the
# hard way: a hardcoded list left one crate behind, which put two versions in
# Cargo.lock and hard-failed Security Audit on main.
#
# A repo is a consumer if it carries the caller file; that is checked before
# anything is sent, so repos without one are skipped rather than dispatched at
# and reported as unreachable. A consumer that cannot be dispatched to is FILED
# ON THE REGISTER, and the run stays green. The first release through this wire,
# tronc 1.0.0 on 2026-09-04, reached two of eleven consumers —
# DRAVR_PLATFORM_DISPATCH_TOKEN was scoped to the platform and photograveur —
# and the run was green with nine warnings nobody was reading. The fix is not
# to make the run red: by this job the crate is already published and tagged,
# and a red tronc lane stops every session that touches tronc for a reach
# problem that is the token's, not the release's. So a miss opens or updates
# one carnet issue naming the repos and the hand-dispatch line, the same way a
# consumer's own chain files its stalls. Reach is a property of the token, not
# of this file. The weekly cron on each caller remains the safety net for a
# dispatch lost in transit.

name: "Tronc: Notify Consumers of Release"

on:
  workflow_call:
    inputs:
      version:
        description: "Tag to announce"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to announce (defaults to the latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Dispatch tronc-released across the org
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version being announced
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a release tag to announce"
            exit 1
          fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "announcing ${VERSION}"

      - name: Fire repository_dispatch at every live repo in the org
        env:
          GH_TOKEN: ${{ secrets.DRAVR_PLATFORM_DISPATCH_TOKEN }}
          CARNET_TOKEN: ${{ secrets.DRAVR_CARNET_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          REPOS=$(gh api --paginate 'orgs/dravr-ai/repos?type=all&per_page=100' \
                  --jq '.[] | select(.archived == false) | select(.fork == false) | .full_name')
          SENT=""; MISSED=""; NOT_CONSUMER=""; UNREADABLE=""
          if [ -z "${REPOS}" ]; then
            # The token cannot see the org at all. Same rule as every other miss: it
            # is the token's problem, filed below, never a red release.
            echo "::warning::listed no repos — DRAVR_PLATFORM_DISPATCH_TOKEN cannot see the org; filing on the register"
            UNREADABLE="dravr-ai/(org listing failed)"
          fi
          for R in ${REPOS}; do
            # Consumer or not: the caller file is the enrolment, so its presence is
            # the test. 200 = consumer; 404 = not a consumer, skip quietly; anything
            # else means the token cannot even read the repo, which is the same
            # failure as not being able to dispatch to it.
            CODE=$(gh api "repos/${R}/contents/.github/workflows/tronc-bump.yml" \
                     -H "Accept: application/vnd.github.object" >/dev/null 2>&1 && echo 200 || echo other)
            if [ "${CODE}" != "200" ]; then
              if gh api "repos/${R}" >/dev/null 2>&1; then
                NOT_CONSUMER="${NOT_CONSUMER} ${R}"
              else
                echo "::warning::cannot read ${R} with DRAVR_PLATFORM_DISPATCH_TOKEN — widen the token's repository access"
                UNREADABLE="${UNREADABLE} ${R}"
              fi
              continue
            fi
            # A consumer answers 204 to the dispatch whether or not its run then
            # does anything; the consumer's own run is the evidence, not this send.
            if gh api -X POST "repos/${R}/dispatches" \
                 -f event_type=tronc-released \
                 -F client_payload[version]="${VERSION}" \
                 -F client_payload[sha]="${GITHUB_SHA}" 2>/dev/null; then
              echo "dispatched -> ${R}"
              SENT="${SENT} ${R}"
            else
              echo "::warning::could not dispatch to consumer ${R} — token scope, or Actions disabled there"
              MISSED="${MISSED} ${R}"
            fi
          done

          {
            echo "### tronc ${VERSION} announced"
            echo ""
            echo "Dispatched \`tronc-released\` to **$(echo ${SENT} | wc -w | tr -d ' ')** consumer(s):"
            for R in ${SENT}; do echo "- \`${R}\`"; done
            if [ -n "${MISSED}${UNREADABLE}" ]; then
              echo ""
              echo "**Could not reach** — filed on the register; the release itself is done:"
              for R in ${MISSED} ${UNREADABLE}; do echo "- \`${R}\`"; done
              echo ""
              echo "Dispatch each by hand meanwhile: \`gh workflow run tronc-bump.yml -R <repo> -f version=${VERSION}\`."
            fi
            if [ -n "${NOT_CONSUMER}" ]; then
              echo ""
              echo "Not consumers (no \`tronc-bump.yml\`), skipped:"
              for R in ${NOT_CONSUMER}; do echo "- \`${R}\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A miss is a tracked issue, never a red release: by now the crate is
          # published and tagged, and a red tronc lane blocks every session that
          # touches tronc. One issue per version, updated rather than duplicated.
          if [ -n "${MISSED}${UNREADABLE}" ] || [ -z "${SENT}" ]; then
            N=$(echo ${MISSED} ${UNREADABLE} | wc -w | tr -d ' ')
            TRACKER="dravr-ai/dravr-carnet"
            TITLE="[platform] tronc ${VERSION} announcement did not reach ${N} consumer(s)"
            # Indented to this block's level on purpose: YAML strips a block scalar's
            # common indentation, so the shell receives column 0.
            BODY=$(cat <<EOF
          tronc **${VERSION}** is published and tagged; its announcement to consumers reached **$(echo ${SENT} | wc -w | tr -d ' ')** and could not reach **${N}**. Run: ${RUN_URL}

          Unreached:
          $(for R in ${MISSED} ${UNREADABLE}; do echo "- \`${R}\`"; done)

          Reach is a property of \`DRAVR_PLATFORM_DISPATCH_TOKEN\` — a fine-grained PAT whose repository access must include every consumer (Contents: read & write). Widen it, then re-run this workflow (\`notify-consumers.yml\`, version \`v${VERSION}\`) or dispatch each consumer by hand:

          \`\`\`
          $(for R in ${MISSED} ${UNREADABLE}; do echo "gh workflow run tronc-bump.yml -R ${R} -f version=${VERSION}"; done)
          \`\`\`

          Each consumer's weekly cron also picks the release up on its own. _Filed by \`notify-consumers.yml\` in dravr-tronc._
          EOF
            )
            EXISTING=$(GH_TOKEN="${CARNET_TOKEN}" gh issue list --repo "$TRACKER" --state open \
                         --search "tronc ${VERSION} announcement did not reach in:title" \
                         --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "${EXISTING}" ]; then
              GH_TOKEN="${CARNET_TOKEN}" gh issue edit "${EXISTING}" --repo "$TRACKER" --title "$TITLE" --body "$BODY" >/dev/null 2>&1 \
                && echo "::warning::${N} consumer(s) unreached — updated ${TRACKER}#${EXISTING}"
            else
              URL=$(GH_TOKEN="${CARNET_TOKEN}" gh issue create --repo "$TRACKER" --title "$TITLE" --body "$BODY" 2>/dev/null || true)
              echo "::warning::${N} consumer(s) unreached — filed ${URL:-on ${TRACKER} (create failed: check DRAVR_CARNET_TOKEN)}"
            fi
          fi

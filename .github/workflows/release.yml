# ABOUTME: Cuts a dravr-tronc release through dravr-build-config's release-crate.yml, then tells every consumer
# ABOUTME: Also republishes an existing tag to crates.io when `tag` is set, skipping the bump

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (ignored when tag is set)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: 'Republish an existing tag to crates.io (e.g. v0.6.0) — skips the version bump'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # Bump mode: bump, commit, push main and the tag atomically, publish, GitHub release.
  # Tag mode: publish that tag to crates.io and nothing else.
  release:
    name: Bump, tag, publish and release
    uses: dravr-ai/dravr-build-config/.github/workflows/release-crate.yml@main
    with:
      bump: ${{ inputs.bump }}
      tag: ${{ inputs.tag }}
      publish: dravr-tronc
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tell the consumers. Called from here rather than triggered by `on: release` in
  # notify-consumers.yml, because the release above is created with the default
  # GITHUB_TOKEN and GitHub does not start workflow runs from events a GITHUB_TOKEN
  # produced — an `on: release` trigger could never fire. sciotte's notifier logged
  # zero runs across five releases that way.
  #
  # After the whole release job on purpose: it publishes to crates.io before it
  # succeeds, and announcing a version crates.io does not carry sends every consumer
  # into a fifteen-minute registry wait that ends in a failed bump.
  notify:
    name: Notify consumers
    needs: release
    uses: ./.github/workflows/notify-consumers.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
